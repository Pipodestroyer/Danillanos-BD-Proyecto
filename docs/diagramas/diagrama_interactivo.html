<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danillanos • Visor de Diagramas UML y Entidad-Relación (E-R)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --bg-main: #070a13;
      --bg-surface: #0f172a;
      --bg-elevated: #1e293b;
      --border-subtle: #1e293b;
      --border-strong: #334155;
      --brand-red: #e01a2c;
      --brand-blue: #3b82f6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.75rem;
      background-color: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border-strong);
      backdrop-filter: blur(12px);
      z-index: 50;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-logo-pill {
      background: linear-gradient(135deg, var(--brand-red) 0%, #991b1b 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      letter-spacing: 0.05em;
    }

    .brand-titles h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .brand-titles p {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background-color: var(--bg-main);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.is-active {
      background-color: var(--brand-red);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(224, 26, 44, 0.35);
    }

    .tab-btn.is-active.is-uml {
      background-color: var(--brand-blue);
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.35);
    }

    /* Action Controls */
    .action-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      height: 36px;
      padding: 0 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .ctrl-btn:hover {
      background-color: var(--bg-elevated);
      border-color: #64748b;
    }

    .ctrl-btn .material-symbols-rounded {
      font-size: 1.15rem;
    }

    /* Main Viewport */
    .viewport-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: radial-gradient(circle at 50% 50%, #0d1527 0%, #030712 100%);
    }

    .viewport-container:active {
      cursor: grabbing;
    }

    .diagram-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 0 0;
      transition: opacity 0.25s ease;
    }

    .diagram-layer.hidden {
      display: none;
      opacity: 0;
    }

    .diagram-layer svg {
      width: auto;
      height: 94%;
      max-width: none;
      max-height: none;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.65));
      user-select: none;
      pointer-events: none;
    }

    /* Floating Zoom HUD */
    .zoom-hud {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem;
      background-color: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 40;
    }

    .zoom-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .zoom-btn:hover {
      background-color: var(--bg-elevated);
    }

    .zoom-level-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0 0.45rem;
      min-width: 52px;
      text-align: center;
      color: var(--text-secondary);
    }

    /* Floating Quick Info Pill */
    .info-hud {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.55rem 1rem;
      background-color: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      font-size: 0.78rem;
      color: var(--text-secondary);
      z-index: 40;
    }

    .info-hud strong {
      color: var(--text-primary);
    }

    .info-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background-color: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-group">
      <div class="brand-logo-pill">DANILLANOS</div>
      <div class="brand-titles">
        <h1 id="diagramMainTitle">Diagrama Entidad - Relación (E-R)</h1>
        <p>Base de Datos Relacional MySQL • 10 Tablas • Seguridad Criptográfica AES-256-GCM + Scrypt</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-switcher" role="tablist">
      <button type="button" class="tab-btn is-active" id="tabEr" role="tab">
        <span class="material-symbols-rounded">schema</span>
        <span>Diagrama E-R (MySQL)</span>
      </button>
      <button type="button" class="tab-btn" id="tabUml" role="tab">
        <span class="material-symbols-rounded">account_tree</span>
        <span>Diagrama UML (Clases)</span>
      </button>
    </div>

    <!-- Actions -->
    <div class="action-controls">
      <a href="diagrama_er_danillanos.svg" download="diagrama_er_danillanos.svg" class="ctrl-btn" id="btnDownloadSvg" title="Descargar archivo vectorial SVG en alta resolución">
        <span class="material-symbols-rounded">download</span>
        <span>Descargar SVG</span>
      </a>
      <button type="button" class="ctrl-btn" id="btnResetView" title="Restablecer escala original">
        <span class="material-symbols-rounded">center_focus_strong</span>
        <span>Centrar</span>
      </button>
    </div>
  </header>

  <!-- Canvas Container -->
  <main class="viewport-container" id="viewport">
    
    <!-- ER Diagram Layer -->
    <div class="diagram-layer" id="layerEr">
      <object type="image/svg+xml" data="diagrama_er_danillanos.svg" id="svgErObject" style="width: 100%; height: 100%; pointer-events: none;"></object>
    </div>

    <!-- UML Diagram Layer -->
    <div class="diagram-layer hidden" id="layerUml">
      <object type="image/svg+xml" data="diagrama_uml_danillanos.svg" id="svgUmlObject" style="width: 100%; height: 100%; pointer-events: none;"></object>
    </div>

    <!-- Info Pill -->
    <div class="info-hud">
      <span>Motor: <strong>MySQL 8.0+</strong></span>
      <span>•</span>
      <span>Tablas: <strong>10 Normalizadas</strong></span>
      <span>•</span>
      <span class="info-tag">🔒 AES-256-GCM + Scrypt KDF</span>
      <span>•</span>
      <span style="font-size:0.75rem; color:#64748b;">Arrastra para mover • Rueda para zoom</span>
    </div>

    <!-- Zoom HUD -->
    <div class="zoom-hud">
      <button type="button" class="zoom-btn" id="btnZoomOut" title="Reducir zoom">
        <span class="material-symbols-rounded">remove</span>
      </button>
      <span class="zoom-level-text" id="zoomText">100%</span>
      <button type="button" class="zoom-btn" id="btnZoomIn" title="Aumentar zoom">
        <span class="material-symbols-rounded">add</span>
      </button>
    </div>

  </main>

  <script>
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentTab = 'er';

    const viewport = document.getElementById('viewport');
    const layerEr = document.getElementById('layerEr');
    const layerUml = document.getElementById('layerUml');
    const tabEr = document.getElementById('tabEr');
    const tabUml = document.getElementById('tabUml');
    const zoomText = document.getElementById('zoomText');
    const diagramMainTitle = document.getElementById('diagramMainTitle');
    const btnDownloadSvg = document.getElementById('btnDownloadSvg');

    function updateTransform() {
      const activeLayer = currentTab === 'er' ? layerEr : layerUml;
      activeLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomText.textContent = `${Math.round(scale * 100)}%`;
    }

    function resetView() {
      scale = 1;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    // Tab Switching
    tabEr.addEventListener('click', () => {
      currentTab = 'er';
      tabEr.classList.add('is-active');
      tabEr.classList.remove('is-uml');
      tabUml.classList.remove('is-active', 'is-uml');
      layerEr.classList.remove('hidden');
      layerUml.classList.add('hidden');
      diagramMainTitle.textContent = 'Diagrama Entidad - Relación (E-R)';
      btnDownloadSvg.href = 'diagrama_er_danillanos.svg';
      btnDownloadSvg.download = 'diagrama_er_danillanos.svg';
      resetView();
    });

    tabUml.addEventListener('click', () => {
      currentTab = 'uml';
      tabUml.classList.add('is-active', 'is-uml');
      tabEr.classList.remove('is-active', 'is-uml');
      layerUml.classList.remove('hidden');
      layerEr.classList.add('hidden');
      diagramMainTitle.textContent = 'Diagrama de Clases UML (Domain Model)';
      btnDownloadSvg.href = 'diagrama_uml_danillanos.svg';
      btnDownloadSvg.download = 'diagrama_uml_danillanos.svg';
      resetView();
    });

    // Zoom Controls
    document.getElementById('btnZoomIn').addEventListener('click', () => {
      scale = Math.min(3.5, scale + 0.2);
      updateTransform();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      scale = Math.max(0.3, scale - 0.2);
      updateTransform();
    });

    document.getElementById('btnResetView').addEventListener('click', resetView);

    // Mouse Wheel Zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.12 : 0.12;
      scale = Math.min(3.5, Math.max(0.3, scale + delta));
      updateTransform();
    }, { passive: false });

    // Drag to Pan
    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    resetView();
  </script>
</body>
</html>
