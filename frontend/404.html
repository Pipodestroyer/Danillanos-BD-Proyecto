<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página No Encontrada | Danillanos</title>

  <!-- Tipografías corporativas e iconografía Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" />

  <!-- Hoja de estilos compartida -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Encabezado simplificado con navegación de retorno a la tienda -->
  <header class="site-header">
    <div class="header-container">
      <div class="header-nav-left">
        <a href="index.html" class="nav-btn" aria-label="Volver a la tienda">
          <span class="nav-btn-text">Tienda</span>
          <span class="material-symbols-rounded nav-btn-icon">storefront</span>
        </a>
      </div>
      <div class="header-brand-center">
        <a href="index.html" class="brand-link" aria-label="Inicio Danillanos">
          <div class="brand-text-wrapper">
            <span class="brand-name">DANILLANOS</span>
            <span class="brand-tagline">DISTRIBUIMOS CALIDAD</span>
          </div>
        </a>
      </div>
      <div class="header-actions-right"></div>
    </div>
  </header>

  <!-- Contenedor central de notificación de recurso no encontrado -->
  <main class="error-404-view">
    <div class="error-404-card">
      <div class="error-404-badge">ERROR 404</div>
      <span class="material-symbols-rounded error-404-icon" aria-hidden="true">explore_off</span>
      <h1>404 - Página No Encontrada</h1>
      <p>
        La página solicitada no existe o no cuenta con los privilegios requeridos para su visualización.
      </p>
      <a href="index.html" class="btn-primary btn-return-home">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        <span>Volver a la tienda principal</span>
      </a>
    </div>
  </main>
</body>
</html>
